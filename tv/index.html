<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix PLC TV</title>
<style>
:root { --bg:#0b0d12; --tx:#f2f4f8; --mut:#a3aab8; --acc:#2ee6c5; }
body { margin:0; background:var(--bg); color:var(--tx); font-family: system-ui, sans-serif; display:grid; place-items:center; min-height:100vh; padding:16px; box-sizing:border-box; }
main { max-width:640px; text-align:center; }
.logo { font-weight:900; color:var(--acc); letter-spacing:.06em; font-size:28px; }
.logo b { color:var(--tx); font-weight:300; }
a.dl { display:inline-block; margin:24px 0; padding:18px 36px; background:var(--tx); color:#000; font-weight:800; font-size:22px; border-radius:10px; text-decoration:none; }
a.dl:focus { outline:4px solid var(--acc); outline-offset:4px; }
ol { text-align:left; color:var(--mut); line-height:1.6; }
</style>
</head>
<body>
<main>
  <div class="logo">NETFLIX <b>PLC</b> TV</div>
  <p>App para Android TV, Google TV y Fire TV.</p>
  <a class="dl" href="https://github.com/jazzkevmel-arch/rclone-kevin/releases/download/tv-latest/NetflixPLC-TV.apk" autofocus>Descargar la app</a>
  <ol>
    <li>Pulsa OK en «Descargar la app» y luego «Instalar».</li>
    <li>Si el televisor lo pide, permite instalar apps de esta fuente (solo la primera vez).</li>
    <li>Abre «Netflix PLC» y escanea el código con tu celular para enlazarlo.</li>
  </ol>
</main>
</body>
</html>
