<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix PLC TV</title>
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="../icono.svg">
<style>
/* Sized for TV: 1rem = 1/96 of the screen width (20 px on a 1920 px screen). */
:root { --bg:#0b0d12; --card:#1a1e27; --tx:#f2f4f8; --mut:#a3aab8; --acc:#2ee6c5; --acc2:#8b7bff; --ring:#ffffff; }
html { font-size: calc(100vw / 96); background: var(--bg); }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font-family: Roboto, "Segoe UI", system-ui, sans-serif; overflow:hidden; height:100vh; cursor:none; }
.scr { position:absolute; inset:0; overflow:hidden; }
[hidden] { display:none !important; }

/* top bar */
.top { position:absolute; top:0; left:0; right:0; height:5rem; display:flex; align-items:center; gap:1.6rem; padding:0 3.5rem; z-index:5;
  background:linear-gradient(var(--bg) 30%, transparent); }
.logo { font-weight:900; font-size:1.7rem; letter-spacing:.06em; color:var(--acc); margin-right:1.4rem; }
.logo b { color:var(--tx); font-weight:300; }
.tab { font-size:1.05rem; color:var(--mut); padding:.45rem 1rem; border-radius:2rem; border:.12rem solid transparent; }
.tab.sel { color:var(--tx); font-weight:700; }
.tab.on { background:var(--tx); color:#000; }
.sync { margin-left:auto; font-size:.8rem; color:var(--mut); }

/* hero: shows the focused title */
.hero { position:absolute; top:0; left:0; right:0; height:52vh; padding:6.5rem 3.5rem 0; overflow:hidden; }
.hero .bg { position:absolute; inset:0; background:
  radial-gradient(ellipse at 78% 30%, hsl(var(--h,200) 70% 45% / .55), transparent 60%),
  radial-gradient(ellipse at 95% 90%, hsl(calc(var(--h,200) + 40) 70% 40% / .45), transparent 55%),
  linear-gradient(90deg, var(--bg) 25%, transparent 75%); transition: background .4s; }
.hero .bg::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%, var(--bg)); }
.hero > div:not(.bg) { position:relative; max-width:52rem; }
.hcat { color:var(--acc); font-weight:700; letter-spacing:.12em; font-size:.85rem; text-transform:uppercase; }
.htitle { font-size:2.9rem; font-weight:900; line-height:1.05; margin:.6rem 0 .5rem; text-wrap:balance;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.hsub { font-size:1.15rem; color:#d7dbe4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.hmeta { margin-top:.9rem; font-size:.95rem; color:var(--mut); display:flex; gap:1.2rem; align-items:center; }
.hbar { width:12rem; height:.3rem; background:#ffffff30; border-radius:1rem; overflow:hidden; }
.hbar i { display:block; height:100%; background:var(--acc); }
.hok { color:var(--acc); font-weight:700; }

/* rows */
.rows { position:absolute; top:52vh; left:0; right:0; bottom:0; overflow:hidden; }
.rowsin { transition: transform .3s ease; will-change: transform; }
.row { padding: 0 0 .6rem; }
.row h3 { margin:0 3.5rem .6rem; font-size:1.25rem; font-weight:700; }
.trk { display:flex; gap:.9rem; padding:1.2rem 3.5rem; transition: transform .3s ease; will-change: transform; }

/* tiles */
.t { flex:0 0 16.5rem; border-radius:.5rem; transition: transform .18s ease, box-shadow .18s; transform-origin:center; }
.t .a { aspect-ratio:16/9; border-radius:.5rem; position:relative; overflow:hidden; padding:.8rem .9rem;
  background: linear-gradient(135deg, hsl(var(--h) 60% 34%), hsl(calc(var(--h) + 35) 55% 18%)); display:flex; flex-direction:column; }
.t .ct { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:#ffffffb0; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t .tt { margin-top:auto; font-size:1.05rem; font-weight:700; line-height:1.2; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.t .ep { position:absolute; right:.6rem; top:.3rem; font-size:2.6rem; font-weight:900; color:#ffffff22; }
.t .ok { position:absolute; right:.6rem; bottom:.5rem; font-size:.7rem; font-weight:800; color:var(--acc); }
.t .pb { position:absolute; left:0; right:0; bottom:0; height:.28rem; background:#ffffff30; }
.t .pb i { display:block; height:100%; background:var(--acc); }
.t.course { flex-basis:16.5rem; }
.t.course .a { background: linear-gradient(160deg, hsl(var(--h) 65% 40%), hsl(calc(var(--h) + 40) 55% 14%) 80%); }
.t.course .tt { font-size:1.15rem; -webkit-line-clamp:2; }
.t.course .n { font-size:.8rem; color:#ffffffb0; margin-top:.4rem; }
.t.on { transform: scale(1.12); z-index:2; position:relative; box-shadow: 0 0 0 .2rem var(--ring), 0 1rem 2rem #000c; }

/* course screen */
.chero { position:absolute; top:0; left:0; right:0; height:46vh; padding:6.5rem 3.5rem 0; }
.btns { display:flex; gap:1rem; margin-top:1.3rem; }
.btn { font-size:1.1rem; font-weight:700; padding:.75rem 1.6rem; border-radius:.4rem; background:#ffffff26; color:var(--tx); transition: transform .15s; }
.btn.on { background:var(--tx); color:#000; transform: scale(1.06); }
.eps { position:absolute; top:46vh; left:0; right:0; bottom:0; overflow:hidden; }
.epsin { transition: transform .3s ease; padding: 0 3.5rem 2rem; }
.sec { color:var(--mut); font-size:.9rem; letter-spacing:.06em; text-transform:uppercase; margin:1.2rem 0 .4rem; }
.e { display:flex; gap:1.4rem; align-items:center; padding:.8rem 1rem; border-radius:.5rem; margin:.2rem 0; transition: background .15s, transform .15s; }
.e .num { font-size:1.6rem; font-weight:900; color:var(--mut); width:3rem; text-align:right; }
.e .et { flex:1; font-size:1.15rem; }
.e .ed { font-size:.9rem; color:var(--mut); }
.e .eb { width:9rem; height:.3rem; background:#ffffff26; border-radius:1rem; overflow:hidden; }
.e .eb i { display:block; height:100%; background:var(--acc); }
.e.on { background:var(--tx); color:#000; transform: scale(1.015); }
.e.on .num, .e.on .ed { color:#333; }

/* search */
.kb { position:absolute; top:6rem; left:3.5rem; width:34rem; }
.kq { font-size:1.6rem; min-height:3rem; border-bottom:.15rem solid #ffffff40; padding:.3rem 0; margin-bottom:1rem; white-space:nowrap; overflow:hidden; }
.kq:empty::before { content:"Escribe con las flechas y OK"; color:var(--mut); font-size:1.1rem; }
.kr { display:flex; gap:.4rem; margin:.4rem 0; }
.k { flex:1; height:3rem; display:grid; place-items:center; font-size:1.25rem; border-radius:.35rem; background:#ffffff14; transition: transform .12s; }
.k.w { flex:3; font-size:1rem; }
.k.on { background:var(--tx); color:#000; transform: scale(1.1); }
.res { position:absolute; top:6rem; left:40rem; right:0; bottom:0; overflow:hidden; }
.res .trk { padding-left:0; flex-wrap:nowrap; }
.res h3 { margin:0 0 .4rem; font-size:1.1rem; color:var(--mut); }
.res .t { flex-basis:14.5rem; }

/* pairing and loading */
.center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; padding:3rem; }
.center h1 { font-size:2.6rem; margin:.4rem 0; }
.center p { font-size:1.2rem; color:var(--mut); max-width:52rem; line-height:1.5; }
.qr { background:#fff; padding:1rem; border-radius:.8rem; margin:1.5rem 0; }
.qr img, .qr canvas { display:block; width:15rem !important; height:15rem !important; }
.code { font-family: monospace; font-size:1rem; color:var(--mut); }

/* next episode card and browser player */
.nextup { position:absolute; right:3.5rem; bottom:3.5rem; width:30rem; background:#12151dee; border-radius:.8rem; padding:1.4rem; z-index:20; box-shadow:0 1rem 3rem #000; }
.nextup .l { color:var(--acc); font-size:.9rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
.nextup .nt { font-size:1.4rem; font-weight:700; margin:.4rem 0 1rem; }
#wp { background:#000; z-index:30; }
#wp video { width:100%; height:100%; }
.wpt { position:absolute; left:3rem; top:2rem; font-size:1.3rem; text-shadow:0 0 1rem #000; transition: opacity .3s; }
.toast { position:absolute; left:50%; bottom:3rem; transform:translateX(-50%); background:#000d; padding:.8rem 1.6rem; border-radius:2rem; font-size:1.1rem; z-index:40; }
</style>
</head>
<body>

<div id="pair" class="scr" hidden>
  <div class="center">
    <div class="logo">NETFLIX <b>PLC</b></div>
    <h1>Enlaza este televisor</h1>
    <p>Escanea el código con la cámara del celular donde ya usas Netflix PLC y toca <b>«Enlazar televisor»</b>. Solo se hace una vez.</p>
    <div class="qr" id="qr"></div>
    <p class="code" id="pcode"></p>
    <p id="pmsg"></p>
  </div>
</div>

<div id="load" class="scr"><div class="center"><div class="logo">NETFLIX <b>PLC</b></div><p id="lmsg">Cargando tus cursos...</p></div></div>

<div id="home" class="scr" hidden>
  <div class="hero" id="hero"><div class="bg"></div><div>
    <div class="hcat" id="hcat"></div><div class="htitle" id="htitle"></div><div class="hsub" id="hsub"></div><div class="hmeta" id="hmeta"></div>
  </div></div>
  <div class="rows"><div class="rowsin" id="rowsin"></div></div>
</div>

<div id="course" class="scr" hidden>
  <div class="chero"><div class="hero" style="height:46vh;padding:0"><div class="bg" id="cbg"></div></div>
    <div style="position:relative;max-width:60rem">
      <div class="hcat" id="ccat"></div><div class="htitle" id="ctitle"></div><div class="hmeta" id="cmeta"></div>
      <div class="btns" data-line="cbtn" id="cbtns"></div>
    </div></div>
  <div class="eps"><div class="epsin" id="epsin"></div></div>
</div>

<div id="search" class="scr" hidden>
  <div class="kb"><div class="kq" id="kq"></div><div id="keys"></div></div>
  <div class="res"><div class="rowsin" id="resin"></div></div>
</div>

<div class="top" id="top" hidden>
  <div class="logo">NETFLIX <b>PLC</b></div>
  <div data-line="tabs" style="display:flex;gap:.6rem">
    <div class="tab f" data-tab="home">Inicio</div>
    <div class="tab f" data-tab="ruta">Mi ruta</div>
    <div class="tab f" data-tab="search">Buscar</div>
  </div>
  <div class="sync" id="sync"></div>
</div>

<div class="nextup" id="nextup" hidden>
  <div class="l" id="nul">Siguiente episodio</div>
  <div class="nt" id="nut"></div>
  <div class="btns" data-line="next"><div class="btn f" data-next="go">▶ Ver ahora</div><div class="btn f" data-next="no">Volver</div></div>
</div>

<div id="wp" class="scr" hidden><video id="video" playsinline></video><div class="wpt" id="wpt"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../drive.js?v=5"></script>
<script src="tv.js?v=2"></script>
</body>
</html>
